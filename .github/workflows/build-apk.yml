name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Version
        run: java -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Temporary Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK Generation
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::app-debug.apk was not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release APK & Environment Variables
        id: prep
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          APK_NAME="${REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug Build #${GITHUB_RUN_NUMBER} (Attempt ${GITHUB_RUN_ATTEMPT})"
          
          cp app/build/outputs/apk/debug/app-debug.apk "./${APK_NAME}"
          
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.prep.outputs.tag_name }}" \
            "./${{ steps.prep.outputs.apk_name }}" \
            --title "${{ steps.prep.outputs.release_title }}" \
            --notes "Automated Debug APK build from commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`." \
            --latest

      - name: Generate Summary
        if: always()
        run: |
          echo "## 📱 Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`app-debug-apk\` (available under workflow run artifacts)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Filename:** \`${{ steps.prep.outputs.apk_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag:** \`${{ steps.prep.outputs.tag_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "🚀 **GitHub Release created successfully:** [View Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.prep.outputs.tag_name }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **GitHub Release:** Skipped or encountered an issue (Artifact is still available above)." >> "$GITHUB_STEP_SUMMARY"
          fi
